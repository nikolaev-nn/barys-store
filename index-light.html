<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barys Store · Светлая тема</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="canonical" href="https://barys.store/">
<script>
/* Compatibility entry point: keep both themes on the current storefront. */
const target = new URL('index.html', location.href);
target.search = location.search;
target.searchParams.set('theme', 'light');
target.hash = location.hash;
location.replace(target.href);
</script>
</head>
<body>
<p><a href="index.html?theme=light">Открыть Barys Store в светлой теме</a></p>
</body>
</html>
